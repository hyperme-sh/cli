name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Binaries exist
        run: test -x bin/hypermesh && test -x bin/hm && ./bin/hypermesh --help >/dev/null
      - name: Verify installed owner license and notice
        shell: bash
        run: |
          set -euo pipefail
          destination=$(mktemp -d "$RUNNER_TEMP/hypermesh-install.XXXXXX")
          trap 'rm -rf -- "$destination"' EXIT
          make install DESTDIR="$destination" PREFIX=/usr
          cmp LICENSE "$destination/usr/share/doc/hypermesh-cli/LICENSE"
          cmp NOTICE "$destination/usr/share/doc/hypermesh-cli/NOTICE"
          test -x "$destination/usr/bin/hypermesh"
          test -x "$destination/usr/bin/hm"
